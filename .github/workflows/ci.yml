name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Linter, Typing, Contracts, Migrations & Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ftth_user
          POSTGRES_PASSWORD: ftth_password
          POSTGRES_DB: ftth_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://ftth_user:ftth_password@localhost:5432/ftth_manager_test
      SECRET_KEY: test-secret-key-for-ci-must-be-long-and-secure-enough
      STORAGE_LOCAL_PATH: /tmp/ftth_test_storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Static Type Analysis
        run: uv run mypy app

      - name: OpenAPI Contract Drift Detection
        run: uv run pytest tests/contract/test_openapi_schema.py -v

      - name: Apply Database Migrations (Alembic Head)
        run: uv run alembic upgrade head

      - name: Execute Full Pytest Test Suite
        run: uv run pytest --cov=app --cov-report=xml -v

      - name: Execute Disaster Recovery Restore Drill
        run: uv run python scripts/restore_drill.py

  frontend-ci:
    name: Frontend CI (Lint, Typecheck & Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Component & Integration Tests (Vitest)
        run: pnpm test
