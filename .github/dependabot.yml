# Atualizações de versão DESLIGADAS (open-pull-requests-limit: 0): o repositório mantém só a branch
# principal, sem branches/PRs automáticos. Para voltar a receber PRs semanais, suba o limite (ex.: 5).
# Alertas e correções de segurança do Dependabot são controlados à parte, nas configurações do repositório.
version: 2
updates:
  # Backend Python (uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend (pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Actions fixadas por SHA: o Dependabot propõe os novos SHAs (com o comentário da versão)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Imagens base dos Dockerfiles e do compose
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
