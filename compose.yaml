services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    container_name: ftth_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftth_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ftth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftth_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ftth_user} -d $${POSTGRES_DB:-ftth_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftth_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:-ftth_password}@db:5432/${POSTGRES_DB:-ftth_manager}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftth_backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:-ftth_password}@db:5432/${POSTGRES_DB:-ftth_manager}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-replace-in-production-minimum-32-chars-long}
      CSRF_SECRET: ${CSRF_SECRET:-dev-insecure-csrf-secret-replace-in-production}
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STORAGE_PATH: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
      - public
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftth_worker
    command: ["python", "scripts/run_worker.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:-ftth_password}@db:5432/${POSTGRES_DB:-ftth_manager}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-replace-in-production-minimum-32-chars-long}
      STORAGE_PATH: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ftth_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2.8.4-alpine
    container_name: ftth_caddy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - public
    restart: unless-stopped

networks:
  internal:
    internal: true
  public:

volumes:
  pgdata:
  backend_storage:
  caddy_data:
  caddy_config:
