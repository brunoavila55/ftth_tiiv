services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    container_name: ftth_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftth_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ftth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ftth_user} -d $${POSTGRES_DB:-ftth_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftth_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-ftth_manager}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-ftth_manager}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (openssl rand -hex 32)}
      CSRF_SECRET: ${CSRF_SECRET:?defina CSRF_SECRET no .env (openssl rand -hex 32)}
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      METRICS_SECRET_TOKEN: ${METRICS_SECRET_TOKEN:?defina METRICS_SECRET_TOKEN no .env (openssl rand -hex 16)}
      BACKUP_SIGNING_KEY: ${BACKUP_SIGNING_KEY:?defina BACKUP_SIGNING_KEY no .env (openssl rand -hex 32)}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # Só pares nestas redes (Caddy no docker network) têm X-Forwarded-For/-Proto respeitados
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-["172.16.0.0/12","10.0.0.0/8","192.168.0.0/16"]}
      STORAGE_PATH: /app/storage
      METRICS_DIR: /app/storage/metrics  # volume compartilhado com o worker (métricas agregadas)
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
      - public
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "scripts/run_worker.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-ftth_manager}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (openssl rand -hex 32)}
      CSRF_SECRET: ${CSRF_SECRET:?defina CSRF_SECRET no .env (openssl rand -hex 32)}
      METRICS_SECRET_TOKEN: ${METRICS_SECRET_TOKEN:?defina METRICS_SECRET_TOKEN no .env (openssl rand -hex 16)}
      BACKUP_SIGNING_KEY: ${BACKUP_SIGNING_KEY:?defina BACKUP_SIGNING_KEY no .env (openssl rand -hex 32)}
      STORAGE_PATH: /app/storage
      METRICS_DIR: /app/storage/metrics
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_HEARTBEAT_FILE: /tmp/ftth-worker.heartbeat
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # O worker grava o heartbeat a cada iteração do loop; falha se ficar velho (> 300 s)
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backend_storage:/app/storage
    networks:
      - internal
    restart: unless-stopped

  # Backup agendado (opt-in): docker compose --profile backup up -d backup
  # Gera um pacote assinado (e criptografado, se BACKUP_ENCRYPTION_KEY estiver definida) a cada
  # BACKUP_INTERVAL_SECONDS (padrão 24 h) no volume `backups` e mantém os últimos N. Copie o volume
  # para fora do servidor (rsync/rclone) — um backup no mesmo disco não protege contra perda do host.
  backup:
    profiles: ["backup"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        while true; do
        python scripts/backup.py --target-dir /app/backups --retention-count "$${BACKUP_RETENTION_COUNT:-7}";
        sleep "$${BACKUP_INTERVAL_SECONDS:-86400}";
        done
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ftth_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-ftth_manager}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env (openssl rand -hex 32)}
      CSRF_SECRET: ${CSRF_SECRET:?defina CSRF_SECRET no .env (openssl rand -hex 32)}
      METRICS_SECRET_TOKEN: ${METRICS_SECRET_TOKEN:?defina METRICS_SECRET_TOKEN no .env (openssl rand -hex 16)}
      BACKUP_SIGNING_KEY: ${BACKUP_SIGNING_KEY:?defina BACKUP_SIGNING_KEY no .env (openssl rand -hex 32)}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      STORAGE_PATH: /app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend_storage:/app/storage:ro
      - backups:/app/backups
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2.8.4-alpine
    container_name: ftth_caddy
    environment:
      # Domínio público para TLS automático no Caddy (Let's Encrypt). Padrão ":80": HTTP puro
      # (dev local ou TLS terminado por balanceador externo).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - public
    restart: unless-stopped

networks:
  internal:
    internal: true
  public:

volumes:
  pgdata:
  backend_storage:
  backups:
  caddy_data:
  caddy_config:
